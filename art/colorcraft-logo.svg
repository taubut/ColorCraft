<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#2a2118"/>
      <stop offset="0.6" stop-color="#16110c"/>
      <stop offset="1" stop-color="#0a0806"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8b54a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="url(#rim)" stroke-opacity="0.8" stroke-width="7"/>

  <!-- four recipe rows: glow, bar, skill-up chevrons -->
  <!-- orange: optimal (three chevrons) -->
  <g>
    <rect x="178" y="104" width="250" height="44" rx="22" fill="#ff8040" opacity="0.55" filter="url(#glow)"/>
    <rect x="178" y="104" width="250" height="44" rx="22" fill="#ff8040"/>
    <path d="M98 115 L118 99 L138 115" fill="none" stroke="#ff8040" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M98 134 L118 118 L138 134" fill="none" stroke="#ff8040" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M98 153 L118 137 L138 153" fill="none" stroke="#ff8040" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- yellow: medium (two) -->
  <g>
    <rect x="178" y="190" width="210" height="44" rx="22" fill="#ffe040" opacity="0.5" filter="url(#glow)"/>
    <rect x="178" y="190" width="210" height="44" rx="22" fill="#ffe040"/>
    <path d="M98 210 L118 194 L138 210" fill="none" stroke="#ffe040" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M98 230 L118 214 L138 230" fill="none" stroke="#ffe040" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- green: easy (one) -->
  <g>
    <rect x="178" y="276" width="232" height="44" rx="22" fill="#40d040" opacity="0.5" filter="url(#glow)"/>
    <rect x="178" y="276" width="232" height="44" rx="22" fill="#40d040"/>
    <path d="M98 306 L118 290 L138 306" fill="none" stroke="#40d040" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- gray: trivial -->
  <g>
    <rect x="178" y="362" width="190" height="44" rx="22" fill="#8c8c8c"/>
    <circle cx="118" cy="384" r="9" fill="#8c8c8c"/>
  </g>
</svg>
